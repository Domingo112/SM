name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
       -  uses: actions/checkout@v4
       -  uses: actions/setup-python@v5
          with:
            python-version: '3.11'
       -  uses: subosito/flutter-action@v2
          with:
            channel: stable
            flutter-version: '3.22.2'
       - name: Install flet
         run: pip install flet
       - name: Build APK
         run: flet build apk
       - name: Upload APK
         uses: actions/upload-artifact@v4
         with:
          name: apk
          path: build/apk
